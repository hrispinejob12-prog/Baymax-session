<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Baymax MD - WhatsApp Linker</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
  <style>
   :root {
      --primary-color: #0ff;        /* Neon Cyan */
      --secondary-color: #ff00ff;   /* Neon Magenta */
      --text-color: #ffffff;
      --background-color: #0a0a0a;
      --border-color: rgba(0, 255, 255, 0.3);
      --glow-color: #0ff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--background-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .container {
      width: 100%;
      max-width: 450px;
      background: #111;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 0 20px var(--glow-color);
      border: 1px solid var(--border-color);
    }

    .header { text-align: center; margin-bottom: 25px; }

    .logo {
      width: 70px; height: 70px; margin: 0 auto 16px;
      background: var(--primary-color);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; color: #0a0a0a;
      box-shadow: 0 0 15px var(--primary-color), 0 0 30px var(--secondary-color);
    }

    .title {
      font-size: 24px; font-weight: 700; margin-bottom: 8px;
      color: var(--primary-color);
      text-shadow: 0 0 8px var(--primary-color), 0 0 16px var(--secondary-color);
    }

    .subtitle { font-size: 14px; color: rgba(255, 255, 255, 0.6); margin-bottom: 20px; }

    .social-icons { display: flex; justify-content: center; gap: 12px; margin-bottom: 20px; }
    .social-icons a {
      width: 44px; height: 44px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #0a0a0a; font-size: 18px; text-decoration: none;
      transition: all 0.3s ease;
    }
    .social-icons a.youtube { background: #ff0044; box-shadow: 0 0 8px #ff0044; }
    .social-icons a.telegram { background: #00ccff; box-shadow: 0 0 8px #00ccff; }
    .social-icons a.whatsapp { background: #00ff99; box-shadow: 0 0 8px #00ff99; }
    .social-icons a.github { background: #888; box-shadow: 0 0 8px #888; }
    .social-icons a:hover { transform: scale(1.2); }
    
    /* Toggle Switch Styles */
    .toggle-container {
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 20px; background: #222;
      border-radius: 12px; padding: 4px;
      border: 1px solid var(--border-color);
    }
    .toggle-option {
      flex: 1; padding: 10px 16px; text-align: center;
      cursor: pointer; border-radius: 8px; font-size: 14px;
      font-weight: 500; transition: all 0.3s ease;
      color: rgba(255,255,255,0.6);
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .toggle-option.active {
      background: var(--primary-color); color: #0a0a0a;
      box-shadow: 0 0 8px var(--primary-color), 0 0 16px var(--secondary-color);
    }
    
    .input-group { margin-bottom: 15px; }
    .input-label { display: block; font-size: 13px; margin-bottom: 5px; color: rgba(255,255,255,0.6); }

    .copy-btn, .generate-btn {
      width: 100%; padding: 12px; border-radius: 12px;
      font-size: 15px; font-weight: 600; cursor: pointer;
      border: 1.5px solid var(--border-color); background: #111;
      color: var(--primary-color); text-shadow: 0 0 5px var(--primary-color);
      box-shadow: 0 0 8px var(--primary-color); transition: all 0.3s ease;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .copy-btn:hover, .generate-btn:hover { background: #000; border-color: var(--secondary-color); }
    
    .input-field {
      width: 100%; padding: 12px;
      border: 1.5px solid var(--border-color);
      border-radius: 12px; background: #111;
      color: var(--text-color); font-size: 15px;
    }
    .input-field:focus { outline: none; border-color: var(--primary-color); }

    .code-display, .loading, .qr-display-container {
      background: #111; padding: 16px; border-radius: 12px;
      border: 1.5px solid var(--border-color); text-align: center;
      font-size: 16px; font-weight: 600; color: var(--primary-color);
      margin-top: 15px; word-wrap: break-word;
    }
    
    .qr-display-container img {
      max-width: 100%; height: auto;
      border-radius: 8px;
    }
    
    .qr-instructions {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 10px;
    }

    .loading i { font-size: 24px; color: var(--primary-color); animation: spin 1s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .footer { text-align: center; margin-top: 20px; font-size: 12px; color: rgba(255, 255, 255, 0.4); }
    .error-message { color: #ff4d4d; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo"><i class="fas fa-robot"></i></div>
      <h1 class="title">Baymax MD</h1>
      <p class="subtitle">Link your WhatsApp device</p>
      <div class="social-icons">
        <a href="https://www.youtube.com/@ridz-coder01?sub_confirmation=1" target="_blank" class="youtube"><i class="fab fa-youtube"></i></a>
        <a href="https://t.me/ridz-coder01" target="_blank" class="telegram"><i class="fab fa-telegram-plane"></i></a>
        <a href="https://whatsapp.com/channel/0029VaXVc0NFy725FNnYvc32" target="_blank" class="whatsapp"><i class="fab fa-whatsapp"></i></a>
        <a href="https://github.com/ridz-coder01/BAYMAX-MD" target="_blank" class="github"><i class="fab fa-github"></i></a>
      </div>
    </div>
    
    <div class="toggle-container">
      <div class="toggle-option active" id="showPairBtn">
        <i class="fas fa-key"></i> Pair Code
      </div>
      <div class="toggle-option" id="showQrBtn">
        <i class="fas fa-qrcode"></i> QR Code
      </div>
    </div>

    <div id="pairContainer">
      <div class="input-group">
        <label class="input-label">Enter your WhatsApp number with country code</label>
        <input type="text" id="mobileNumber" class="input-field" placeholder="+1234567890">
      </div>
      <button class="generate-btn" id="submitPairCode">
        <i class="fas fa-key"></i> Generate Pair Code
      </button>
      <div class="code-display" id="codeDisplay" style="display: none;"></div>
      <button class="copy-btn" id="copy" style="display: none;">
        <i class="fas fa-copy"></i> Copy Code
      </button>
    </div>

    <div id="qrContainer" style="display: none;">
        <p class="qr-instructions">Scan this QR code using the "Linked devices" screen in your WhatsApp settings.</p>
        <div class="qr-display-container">
            <img id="qrImage" src="" alt="QR Code Loading...">
        </div>
    </div>
    
    <div class="loading" id="loading" style="display: none;">
      <i class="fas fa-spinner"></i>
    </div>
    
    <div class="footer">
      <p>© 2025 Ridz Coder | BAYMAX MD</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  
  <script>
    // --- Element References ---
    const showPairBtn = document.getElementById('showPairBtn');
    const showQrBtn = document.getElementById('showQrBtn');
    
    const pairContainer = document.getElementById('pairContainer');
    const qrContainer = document.getElementById('qrContainer');
    
    const submitPairCodeBtn = document.getElementById("submitPairCode");
    const mobileNumberInput = document.getElementById("mobileNumber");
    const codeDisplay = document.getElementById("codeDisplay");
    const copyBtn = document.getElementById("copy");
    
    const qrImage = document.getElementById('qrImage');
    const loadingSpinner = document.getElementById("loading");

    // --- NEW --- Variable to hold the QR refresh interval
    let qrInterval = null;

    // --- Switch Logic ---
    showPairBtn.addEventListener('click', () => {
      showPairBtn.classList.add('active');
      showQrBtn.classList.remove('active');
      
      pairContainer.style.display = 'block';
      qrContainer.style.display = 'none';
      
      // --- NEW --- Stop the QR refresh interval when switching away
      clearInterval(qrInterval);
      qrImage.src = ''; // Stop any pending image request
    });

    showQrBtn.addEventListener('click', () => {
      showQrBtn.classList.add('active');
      showPairBtn.classList.remove('active');
      
      qrContainer.style.display = 'block';
      pairContainer.style.display = 'none';
      codeDisplay.style.display = 'none';
      copyBtn.style.display = 'none';
      
      // --- NEW --- Function to fetch the QR code
      const fetchQrCode = () => {
        qrImage.src = '/qr?timestamp=' + new Date().getTime();
      };

      // --- NEW --- Stop any previous interval before starting a new one
      clearInterval(qrInterval);

      // Fetch the QR code immediately
      fetchQrCode();
      
      // --- NEW --- Start refreshing the QR code every 15 seconds
      qrInterval = setInterval(fetchQrCode, 15000);
    });

    // --- Pair Code Logic ---
    submitPairCodeBtn.addEventListener("click", async () => {
      const mobileNumber = mobileNumberInput.value.trim();
      
      codeDisplay.style.display = "none";
      copyBtn.style.display = "none";

      if (!mobileNumber || !/^\+[1-9]\d{1,14}$/.test(mobileNumber)) {
        codeDisplay.innerHTML = '<span class="error-message">Please enter a valid number with country code (e.g., +1234567890)</span>';
        codeDisplay.style.display = "block";
        return;
      }

      loadingSpinner.style.display = "block";
      submitPairCodeBtn.disabled = true;

      try {
        const response = await axios(`/code?number=${mobileNumber.replace(/[^0-9]/g, "")}`);
        const code = response.data.code;

        if (code) {
          codeDisplay.innerText = code;
          copyBtn.style.display = "flex";
        } else {
          throw new Error("Service Unavailable or invalid response");
        }
      } catch (error) {
        console.error("Error generating code:", error);
        codeDisplay.innerHTML = '<span class="error-message">Error generating code. Please try again.</span>';
      } finally {
        loadingSpinner.style.display = "none";
        codeDisplay.style.display = "block";
        submitPairCodeBtn.disabled = false;
      }
    });

    copyBtn.addEventListener("click", () => {
      const code = codeDisplay.innerText;
      navigator.clipboard.writeText(code).then(() => {
        const originalText = copyBtn.innerHTML;
        copyBtn.innerHTML = '<i class="fas fa-check"></i> Copied!';
        setTimeout(() => { copyBtn.innerHTML = originalText; }, 2000);
      }).catch(err => { console.error("Failed to copy text: ", err); });
    });
  </script>
</body>
</html>
