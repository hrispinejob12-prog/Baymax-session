<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF--8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BWM XMD - WhatsApp Linker</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.0.0-alpha.1/axios.min.js"></script>
  <style>
   :root {
      --primary-color: #0ff;        /* Neon Cyan */
      --secondary-color: #ff00ff;   /* Neon Magenta */
      --accent-color: #00ff99;      /* Neon Green */
      --text-color: #ffffff;
      --background-color: #0a0a0a;  /* Dark background for neon glow */
      --hover-color: rgba(0, 255, 255, 0.1);
      --border-color: rgba(0, 255, 255, 0.3);
      --glow-color: #0ff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--background-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }
    .container {
      width: 100%;
      max-width: 450px;
      background: #111;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 0 20px var(--glow-color);
      border: 1px solid var(--border-color);
    }
    .header { text-align: center; margin-bottom: 25px; }
    .logo {
      width: 70px; height: 70px; margin: 0 auto 16px;
      background: var(--primary-color);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 28px; color: #0a0a0a;
      box-shadow: 0 0 15px var(--primary-color), 0 0 30px var(--secondary-color);
    }
    .title {
      font-size: 24px; font-weight: 700; margin-bottom: 8px; color: var(--primary-color);
      text-shadow: 0 0 8px var(--primary-color), 0 0 16px var(--secondary-color);
    }
    .subtitle { font-size: 14px; color: rgba(255, 255, 255, 0.6); }
    .toggle-container {
      display: flex; align-items: center; justify-content: center; margin-bottom: 20px;
      background: #111; border-radius: 12px; padding: 4px;
      border: 1px solid var(--border-color);
    }
    .toggle-option {
      flex: 1; padding: 10px 16px; text-align: center; cursor: pointer;
      border-radius: 8px; font-size: 14px; font-weight: 500;
      transition: all 0.3s ease; position: relative;
      color: rgba(255,255,255,0.6);
    }
    .toggle-option.active {
      background: var(--primary-color); color: #0a0a0a;
      box-shadow: 0 0 8px var(--primary-color), 0 0 16px var(--secondary-color);
    }
    .toggle-option:hover:not(.active) { background: #222; }
    .input-group { margin-bottom: 16px; }
    .input-field {
      width: 100%; padding: 12px; border: 1.5px solid var(--border-color);
      border-radius: 12px; background: #111; color: var(--text-color); font-size: 15px;
      box-shadow: 0 0 8px rgba(0,255,255,0.3);
    }
    .input-field:focus {
      outline: none; border-color: var(--primary-color);
      box-shadow: 0 0 10px var(--primary-color), 0 0 20px var(--secondary-color);
    }
    .generate-btn {
      width: 100%; padding: 12px; border-radius: 12px; font-size: 15px;
      font-weight: 600; cursor: pointer; border: 1.5px solid var(--border-color);
      background: #111; color: var(--primary-color); text-shadow: 0 0 5px var(--primary-color);
      box-shadow: 0 0 8px var(--primary-color); transition: all 0.3s ease;
      margin-bottom: 16px;
    }
    .generate-btn:hover {
      background: #000; border-color: var(--secondary-color);
      box-shadow: 0 0 15px var(--primary-color), 0 0 25px var(--secondary-color);
    }
    .result-area { margin-top: 16px; text-align: center; }
    .loading { display: none; }
    .loading i {
      font-size: 24px; color: var(--primary-color); animation: spin 1s linear infinite;
      text-shadow: 0 0 8px var(--primary-color), 0 0 16px var(--secondary-color);
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .code-display, .qr-display {
      background: #111; padding: 12px; border-radius: 12px; border: 1.5px solid var(--border-color);
      font-size: 16px; font-weight: 600; color: var(--primary-color);
      box-shadow: 0 0 8px var(--primary-color), 0 0 16px var(--secondary-color);
      word-wrap: break-word; display: none;
    }
    .qr-display img {
        width: 100%; max-width: 250px; margin: 10px auto; border-radius: 8px;
    }
    .footer { text-align: center; margin-top: 20px; font-size: 12px; color: rgba(255, 255, 255, 0.4); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo"><i class="fas fa-robot"></i></div>
      <h1 class="title">BWM XMD</h1>
      <p class="subtitle">Link your WhatsApp device</p>
    </div>

    <div class="toggle-container">
      <div class="toggle-option active" data-mode="pair">
        <i class="fas fa-key"></i> Pair Code
      </div>
      <div class="toggle-option" data-mode="qr">
        <i class="fas fa-qrcode"></i> QR Code
      </div>
    </div>

    <div class="input-group" id="inputGroup">
      <input type="text" id="mobileNumber" class="input-field" placeholder="+254*******">
    </div>

    <button class="generate-btn" id="submit">
      <i class="fas fa-key"></i> Generate Pair Code
    </button>
    
    <div class="result-area">
        <div class="loading" id="loading">
          <i class="fas fa-spinner"></i>
        </div>

        <div class="code-display" id="codeDisplay"></div>
        <div class="qr-display" id="qrDisplay"></div>
    </div>


    <div class="footer">
      <p>© 2025 BWM XMD</p>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
        const toggles = document.querySelectorAll(".toggle-option");
        const submitBtn = document.getElementById("submit");
        const inputGroup = document.getElementById("inputGroup");
        const loadingSpinner = document.getElementById("loading");
        const codeDisplay = document.getElementById("codeDisplay");
        const qrDisplay = document.getElementById("qrDisplay");
        const mobileNumberInput = document.getElementById("mobileNumber");

        let currentMode = 'pair';

        toggles.forEach(toggle => {
            toggle.addEventListener("click", () => {
                currentMode = toggle.dataset.mode;
                
                toggles.forEach(t => t.classList.remove("active"));
                toggle.classList.add("active");

                // Reset displays
                codeDisplay.style.display = 'none';
                qrDisplay.style.display = 'none';
                
                if (currentMode === 'pair') {
                    inputGroup.style.display = 'block';
                    submitBtn.innerHTML = '<i class="fas fa-key"></i> Generate Pair Code';
                } else {
                    inputGroup.style.display = 'none';
                    submitBtn.innerHTML = '<i class="fas fa-qrcode"></i> Generate QR Code';
                }
            });
        });

        submitBtn.addEventListener("click", async () => {
            loadingSpinner.style.display = 'block';
            codeDisplay.style.display = 'none';
            codeDisplay.innerHTML = '';
            qrDisplay.style.display = 'none';
            qrDisplay.innerHTML = '';

            if (currentMode === 'pair') {
                const mobileNumber = mobileNumberInput.value.trim().replace(/[^0-9]/g, "");
                if (!mobileNumber) {
                    codeDisplay.innerHTML = 'Please enter your WhatsApp number';
                    codeDisplay.style.display = 'block';
                    loadingSpinner.style.display = 'none';
                    return;
                }

                try {
                    const response = await axios(`/code?number=${mobileNumber}`);
                    const code = response.data.code;
                    if (code) {
                        codeDisplay.innerHTML = `Your Pair Code: <strong>${code}</strong>`;
                    } else {
                        codeDisplay.innerHTML = 'Service Unavailable. Please try again later.';
                    }
                } catch (error) {
                    console.error("Error generating code:", error);
                    codeDisplay.innerHTML = 'Error generating code. Please try again.';
                } finally {
                    loadingSpinner.style.display = 'none';
                    codeDisplay.style.display = 'block';
                }

            } else { // QR Mode
                const img = document.createElement('img');
                const timestamp = new Date().getTime();
                img.src = `/qr?t=${timestamp}`; // Add timestamp to prevent caching

                img.onload = () => {
                    loadingSpinner.style.display = 'none';
                    qrDisplay.style.display = 'block';
                };
                img.onerror = () => {
                    loadingSpinner.style.display = 'none';
                    qrDisplay.innerHTML = 'Error generating QR Code. Please try again.';
                    qrDisplay.style.display = 'block';
                };
                
                qrDisplay.appendChild(img);
            }
        });
    });
  </script>
</body>
</html>
